<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 100" fill="none" role="img" aria-label="Fiber Connect SA">
  <defs>
    <linearGradient id="fiberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1B3D"/>
      <stop offset="50%" stop-color="#1E5EFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Fiber node (origin point) -->
  <circle cx="26" cy="80" r="5" fill="#00D4FF"/>

  <!-- Fiber optic light path entering the mark -->
  <path d="M31 75 C 40 75, 42 62, 42 54" stroke="url(#fiberGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- F monogram -->
  <rect x="42" y="20" width="9" height="56" rx="4.5" fill="url(#fiberGrad)"/>
  <rect x="42" y="20" width="34" height="9" rx="4.5" fill="#1E5EFF"/>
  <rect x="42" y="42" width="25" height="9" rx="4.5" fill="#2E6BFF"/>

  <!-- 5G signal waves -->
  <rect x="80" y="58" width="7" height="14" rx="3.5" fill="#1E5EFF"/>
  <rect x="91" y="48" width="7" height="24" rx="3.5" fill="#2E6BFF"/>
  <rect x="102" y="38" width="7" height="34" rx="3.5" fill="url(#fiberGrad)"/>
</svg>
